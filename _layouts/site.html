{% include base_path %}<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include seo.html %}
    {% include head/custom.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">
  </head>

  <body class="site">
    <nav class="top-nav">
      <div class="top-nav-inner">
        <a class="nav-name" href="{{ base_path }}/">{{ site.title }}</a>
        <div class="nav-tabs">
          {% for link in site.data.navigation.main %}
            <a href="{{ base_path }}{{ link.url }}"{% if page.url == link.url %} class="active" aria-current="page"{% endif %}>{{ link.title }}</a>
          {% endfor %}
        </div>
      </div>
    </nav>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      &copy; {{ site.time | date: "%Y" }} {{ site.author.name }}
    </footer>
  </body>
</html>
